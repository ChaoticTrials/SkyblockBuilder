modLoader="javafml"
loaderVersion = "[4,)"
license = "${mod.license}"
issueTrackerURL = "${mod.issue_url}"

[[mods]]
modId = "${mod.modid}"
version = "${mod.version}"
displayName="Skyblock Builder"
displayURL = "${mod.source_url}"
updateJSONURL="https://assets.melanx.de/updates/skyblock-builder.json"
authors="MelanX"
description='''
Let you create a custom skyblock island via config
'''

[[dependencies.${ mod.modid }]]
modId = "neoforge"
type = "required"
versionRange = "[${mod.neoforge},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod.modid }]]
modId = "minecraft"
type = "required"
versionRange = "[${mod.minecraft},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod.modid }]]
modId = "libx"
type = "required"
versionRange = "[1.21.1-6.0.9,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod.modid }]]
modId = "minemention"
type = "optional"
versionRange = "[1.21.1,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "${mod.modid}.mixins.json"
