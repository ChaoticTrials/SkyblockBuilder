name: Check for dump file

on:
  issues:
    types:
      - opened

jobs:
  check_for_dump_file:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Extract dump link
        id: extract
        run: |
          issue_body=$(jq -r '.issue.body' < $GITHUB_EVENT_PATH)
          dump_url=$(echo "$issue_body" | grep -Po 'https://github\.com/user-attachments/files/\d+/\d{8}-\d{6}\.zip' | head -1)
          if [ -n "$dump_url" ]; then
            echo "url=$dump_url" >> $GITHUB_OUTPUT
          fi

      - name: Send to dump viewer API
        id: api
        if: steps.extract.outputs.url != ''
        run: |
          response=$(curl -s -X POST https://dumps.chaotictrials.de/api/dump/import \
            -H "Authorization: Bearer ${{ secrets.DUMPVIEWER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"url": "${{ steps.extract.outputs.url }}"}')
          dump_id=$(echo "$response" | jq -r '.id')
          echo "dump_id=$dump_id" >> $GITHUB_OUTPUT

      - name: Post comment
        if: steps.api.outputs.dump_id != ''
        run: |
          gh issue comment "$NUMBER" --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: "Dump file uploaded to https://dumps.chaotictrials.de/${{ steps.api.outputs.dump_id }}"

      - name: Add Label if Zip Link is Present
        if: steps.extract.outputs.url != ''
        run: gh issue edit "$NUMBER" --add-label "$LABELS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: "zip-file-link"
